<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תמונות לכאן | גלריה פרו מקסימום</title>
    
    <link rel="icon" type="image/png" href="1.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* עיצוב בהיר */
            --bg-app: #f4f6f8;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f9fafb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #4f46e5;
            --accent-hover: color-mix(in srgb, var(--accent) 80%, black);
            --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
            --danger: #f43f5e;
            
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.08);
            
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            --glass-bg: rgba(255, 255, 255, 0.85);
            --toast-bg: #1e293b;
            --toast-color: #ffffff;
        }

        [data-theme="dark"] {
            /* עיצוב כהה */
            --bg-app: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-hover: #273548;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --glass-bg: rgba(30, 41, 59, 0.85);
            --toast-bg: #f8fafc;
            --toast-color: #0f172a;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* פס גלילה מותאם */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-app); }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: var(--radius-full); border: 2px solid var(--bg-app); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        * {
            box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rubik', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app); color: var(--text-main);
            min-height: 100vh; transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* פס התקדמות גלילה */
        #scrollProgress {
            position: fixed; top: 0; left: 0; height: 3px; background: var(--accent);
            width: 0%; z-index: 9999; transition: width 0.1s;
        }

        /* כפתור חזרה למעלה */
        #backToTop {
            position: fixed; bottom: 30px; right: 30px; width: 44px; height: 44px;
            background: var(--accent); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
            transition: all 0.3s; z-index: 1000; border: none;
        }
        #backToTop.visible { opacity: 1; pointer-events: auto; }
        #backToTop:hover { transform: translateY(-5px); }

        /* קונפטי קנבס */
        #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9000; }

        .main-container { display: flex; flex: 1; max-width: 1800px; width: 100%; margin: 0 auto; padding: 0 20px 40px; gap: 30px; }
        .content-area { flex: 1; min-width: 0; }
        
        .sidebar { width: 280px; flex-shrink: 0; display: none; flex-direction: column; gap: 20px; position: sticky; top: 90px; height: max-content; }
        .has-sidebar .sidebar { display: flex; }
        @media (max-width: 1024px) { .main-container { flex-direction: column; } .sidebar { width: 100%; position: relative; top: 0; max-width: 400px; margin: 0 auto; } }

        header { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .header-inner { max-width: 1800px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand img { width: 36px; height: 36px; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
        .brand h1 { font-size: 1.4rem; font-weight: 600; color: var(--text-main); letter-spacing: -0.5px; }

        .header-controls { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-muted); width: 40px; height: 40px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; cursor: pointer; }
        .icon-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .layout-switcher { display: flex; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-full); padding: 4px; box-shadow: var(--shadow-sm); }
        .layout-switcher button { background: transparent; border: none; color: var(--text-muted); padding: 6px 12px; font-size: 0.85rem; font-weight: 500; border-radius: var(--radius-full); transition: all 0.2s; cursor: pointer; }
        .layout-switcher button.active { background: var(--accent); color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        @media (max-width: 600px) { .layout-switcher { display: none; } }

        /* תפריט הגדרות */
        .settings-wrapper { position: relative; }
        .settings-dropdown {
            position: absolute; top: 50px; left: 0; background: var(--bg-surface);
            border: 1px solid var(--border-color); border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg); padding: 15px; display: none; flex-direction: column; gap: 12px;
            min-width: 220px; z-index: 200;
        }
        .settings-dropdown.show { display: flex; animation: slideDown 0.2s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .setting-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; font-weight: 500; }
        .setting-btn {
            background: var(--bg-app); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s; width: 100%; display: flex; justify-content: space-between; align-items: center;
        }
        .setting-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
        .color-picker-input { width: 35px; height: 35px; border: none; padding: 0; background: none; cursor: pointer; border-radius: 4px; overflow: hidden;}

        /* אפקט Ripple */
        .ripple { position: absolute; border-radius: 50%; transform: scale(0); animation: ripple-anim 0.6s linear; background-color: rgba(255, 255, 255, 0.4); pointer-events: none; }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        .toolbar { display: flex; flex-direction: column; gap: 16px; padding: 24px 0; }
        .search-bar { display: flex; gap: 12px; flex-wrap: wrap; }
        .search-input-wrapper { flex: 1; position: relative; min-width: 250px; display: flex; align-items: center;}
        .search-icon { position: absolute; right: 16px; width: 18px; height: 18px; fill: var(--text-muted); pointer-events: none;}
        
        /* חיפוש קולי */
        .voice-btn { position: absolute; left: 6px; background: none; border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .voice-btn:hover { background: var(--accent-soft); color: var(--accent); }
        .voice-btn.recording { color: var(--danger); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .search-input { width: 100%; padding: 12px 44px 12px 40px; border-radius: var(--radius-full); border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.2s; box-shadow: var(--shadow-sm); cursor: text;}
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        .sort-select { padding: 0 20px; border-radius: var(--radius-full); border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main); font-size: 0.9rem; font-weight: 500; outline: none; box-shadow: var(--shadow-sm); height: 44px; cursor: pointer;}

        .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;}
        .filter-chip { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500; color: var(--text-muted); transition: all 0.2s; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 6px; cursor: pointer;}
        .filter-chip:hover { border-color: var(--text-muted); }
        .filter-chip.active { background: var(--text-main); color: var(--bg-surface); border-color: var(--text-main); }
        
        .filter-chip.fav { color: var(--danger); border-color: rgba(244, 63, 94, 0.3); }
        .filter-chip.fav svg { width: 14px; height: 14px; fill: currentColor; }
        .filter-chip.fav.active { background: var(--danger); color: white; border-color: var(--danger); }
        
        .filter-chip.autoscroll { color: var(--accent); border-color: var(--accent-soft); }
        .filter-chip.autoscroll.active { background: var(--accent); color: white; border-color: var(--accent); }

        .stats-text { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
        .spinner { width: 16px; height: 16px; border: 2px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* גלריה והטיית 3D */
        .gallery-grid { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); perspective: 1000px; }
        @media (min-width: 500px) { .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 768px) { .gallery-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (min-width: 1200px) { .gallery-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
        @media (min-width: 768px) {
            .gallery-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
            .gallery-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
            .gallery-grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
            .gallery-grid.cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; }
        }

        /* תצוגת רשימה */
        .gallery-grid.list-view { display: flex; flex-direction: column; gap: 15px; }
        .gallery-grid.list-view .img-card { flex-direction: row; height: 100px; align-items: center; }
        .gallery-grid.list-view .card-img-wrap { width: 100px; height: 100px; aspect-ratio: auto; }
        .gallery-grid.list-view .card-footer { flex: 1; flex-direction: row-reverse; justify-content: flex-end; padding: 0 20px; }
        .gallery-grid.list-view .card-title { text-align: right; }

        .img-card {
            background: var(--bg-surface); border-radius: var(--radius-md); overflow: hidden;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); position: relative;
            transform-style: preserve-3d; transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
            will-change: transform;
        }

        .card-img-wrap { width: 100%; aspect-ratio: 1; overflow: hidden; position: relative; background: var(--bg-app); cursor: pointer;}
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; pointer-events: none;}
        .img-card:hover .card-img-wrap img { transform: scale(1.05); }

        .card-actions-top { position: absolute; top: 10px; left: 10px; z-index: 10; }
        .fav-heart-btn { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); width: 32px; height: 32px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; color: white; transition: all 0.2s; cursor: pointer; }
        .fav-heart-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; pointer-events: none;}
        .fav-heart-btn.active { background: var(--danger); border-color: var(--danger); color: white; }
        .fav-heart-btn.active svg { fill: currentColor; }

        .card-footer { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transform: translateZ(20px); }
        .card-title { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: right; flex-grow: 1; pointer-events: none; }
        
        .card-buttons { display: flex; gap: 6px; }
        .action-mini-btn { background: var(--bg-app); border: none; color: var(--text-muted); width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; transition: all 0.2s; cursor: pointer;}
        .action-mini-btn svg { width: 14px; height: 14px; fill: currentColor; pointer-events: none;}
        .action-mini-btn:hover { background: var(--accent-soft); color: var(--accent); }

        /* תפריט הקשר (Context Menu) */
        #contextMenu {
            position: absolute; background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
            display: none; flex-direction: column; padding: 5px; min-width: 150px; z-index: 9999;
        }
        .ctx-item {
            padding: 8px 12px; font-size: 0.85rem; color: var(--text-main); display: flex; align-items: center; gap: 10px;
            border-radius: var(--radius-sm); border: none; background: transparent; cursor: pointer; text-align: right;
        }
        .ctx-item:hover { background: var(--accent); color: white; }
        .ctx-item svg { width: 16px; height: 16px; fill: currentColor; }

        /* פרסומות צד */
        .sidebar-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; margin-bottom: -10px; }
        .sidebar-ad-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); display: block; text-decoration: none; transition: box-shadow 0.3s; cursor: pointer;}
        .sidebar-ad-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent-soft); }
        /* תוקן חיתוך הפרסומות הצדדיות - שמירה מדויקת על אורך ורוחב טבעיים */
        .sidebar-ad-card img { width: 100%; height: auto; display: block; transition: opacity 0.5s ease; }
        .sidebar-ad-card img.fading { opacity: 0.2; }

        /* מודאלים */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 2000; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--bg-surface); padding: 15px; border-radius: var(--radius-lg); max-width: 90vw; max-height: 90vh;
            position: relative; box-shadow: var(--shadow-lg); transform: scale(0.95); transition: transform 0.3s; border: 1px solid var(--border-color); display: flex; flex-direction: column;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-close {
            position: absolute; top: -14px; right: -14px; background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color);
            width: 34px; height: 34px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-md); z-index: 10; transition: all 0.2s; cursor: pointer;
        }
        .modal-close:hover { background: var(--danger); color: white; border-color: var(--danger); }
        .modal-close svg { width: 16px; height: 16px; fill: currentColor; }
        
        /* עיצוב פופאפ פרסומת מיוחד - שמירה על פרופורציות בלי להיחתך */
        .ad-popup-img {
            max-width: 90vw;
            max-height: 80vh;
            width: auto;
            height: auto;
            object-fit: contain;
            background: var(--bg-surface);
            padding: 5px;
            border-radius: var(--radius-lg);
            display: block;
        }

        /* לייטבוקס ועורך תמונות */
        .lb-img { max-width: 100%; max-height: 55vh; border-radius: calc(var(--radius-lg) - 6px); object-fit: contain; transition: filter 0.2s, transform 0.3s; margin: 0 auto; display: block;}
        .lb-controls-wrap { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 15px; width: 100%;}
        
        .lb-editor { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; background: var(--bg-app); padding: 10px 20px; border-radius: var(--radius-full); border: 1px solid var(--border-color); width: 100%;}
        .editor-control { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--text-muted); }
        .editor-control input[type=range] { width: 80px; cursor: pointer;}
        
        .lb-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center;}
        .lb-btn { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--border-color); width: 44px; height: 44px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md); transition: all 0.2s; cursor: pointer; }
        .lb-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .lb-btn svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none;}
        .lb-btn.text-btn { width: auto; padding: 0 20px; font-weight: 500; font-size: 0.9rem; gap: 8px;}
        .lb-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); color: white; padding: 5px 10px; border-radius: var(--radius-sm); font-size: 0.8rem; pointer-events: none; }

        /* סקלטון (Skeleton Loader) */
        .skeleton-card { background: var(--bg-surface); border-radius: var(--radius-md); height: 250px; position: relative; overflow: hidden; border: 1px solid var(--border-color); }
        .skeleton-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 1.5s infinite;
        }
        [data-theme="light"] .skeleton-card::after { background: linear-gradient(90deg, transparent, rgba(0,0,0,0.05), transparent); }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* קיצורי מקלדת */
        .shortcuts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .shortcut-item { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 5px 0; border-bottom: 1px solid var(--border-color); }
        .key-badge { background: var(--bg-app); border: 1px solid var(--border-color); padding: 2px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; }

        /* הודעת Toast */
        .toast { position: fixed; bottom: 30px; left: 30px; background: var(--toast-bg); color: var(--toast-color); padding: 12px 24px; border-radius: var(--radius-full); font-size: 0.9rem; font-weight: 500; box-shadow: var(--shadow-lg); transform: translateY(100px) scale(0.9); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 3000; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-color); }
        .toast.show { transform: translateY(0) scale(1); opacity: 1; }
        .toast svg { width: 18px; height: 18px; fill: currentColor; }
        
        /* טעינה אינסופית אובזרבר */
        #scrollObserver { height: 20px; width: 100%; }

    </style>
</head>
<body id="appBody">
    <div id="scrollProgress"></div>
    <canvas id="confettiCanvas"></canvas>

    <header>
        <div class="header-inner">
            <a href="#" class="brand">
                <img src="1.png" alt="לוגו" onerror="this.style.display='none'">
                <h1>תמונות פרו</h1>
            </a>
            
            <div class="header-controls">
                <div class="layout-switcher">
                    <button onclick="setLayout('list', this)" title="תצוגת רשימה">רשימה</button>
                    <button onclick="setLayout(3, this)">3</button>
                    <button onclick="setLayout(4, this)">4</button>
                    <button class="active" onclick="setLayout(5, this)">5</button>
                    <button onclick="setLayout(6, this)">6</button>
                </div>
                
                <!-- תפריט הגדרות חכם וקומפקטי -->
                <div class="settings-wrapper">
                    <button class="icon-btn" onclick="toggleSettingsMenu(event)" title="הגדרות מתקדמות">

    <!-- טוסט -->

    <script>
        // --- מערכת סניטציה מוחלטת נגד XSS ---
        function sanitizeHTML(str) {
            if (typeof str !== 'string') return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return str.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // --- פס התקדמות וחזרה למעלה ---
        const progressBar = document.getElementById('scrollProgress');
        const bttBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            progressBar.style.width = (winScroll / height) * 100 + "%";
            
            if (winScroll > 300) bttBtn.classList.add('visible');
            else bttBtn.classList.remove('visible');
        });

        // --- תפריט הגדרות חכם ---
        const settingsDropdown = document.getElementById('settingsDropdown');
        function toggleSettingsMenu(e) {
            e.stopPropagation();
            settingsDropdown.classList.toggle('show');
        }
        document.addEventListener('click', (e) => {
            if (!settingsDropdown.contains(e.target)) {
                settingsDropdown.classList.remove('show');
            }
        });

        // --- צלילי ממשק (Web Audio API) ---
        let soundsEnabled = localStorage.getItem('soundsEnabled') !== 'false';
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function updateSoundUI() {
            const soundText = document.getElementById('soundToggleText');
            soundText.textContent = soundsEnabled ? '🔊 קולות: מופעל' : '🔇 קולות: מושתק';
        }
        updateSoundUI();

        function toggleSounds() {
            soundsEnabled = !soundsEnabled;
            localStorage.setItem('soundsEnabled', soundsEnabled);
            updateSoundUI();
            if(soundsEnabled && audioCtx.state !== 'suspended') {
                playTone(400, 'sine', 0.1);
            }
        }

        function playTone(freq, type, duration, vol=0.05) {
            if(!soundsEnabled || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function createRipple(e, el) {
            const circle = document.createElement('span');
            const d = Math.max(el.clientWidth, el.clientHeight);
            circle.style.width = circle.style.height = d + 'px';
            const rect = el.getBoundingClientRect();
            circle.style.left = e.clientX - rect.left - d/2 + 'px';
            circle.style.top = e.clientY - rect.top - d/2 + 'px';
            circle.classList.add('ripple');
            el.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if(this.style.position !== 'absolute') this.style.position = 'relative';
                this.style.overflow = 'hidden';
                createRipple(e, this);
                playTone(600, 'triangle', 0.05); // click sound
            });
        });

        // --- קונפטי ---
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function fireConfetti(x, y) {
            playTone(800, 'sine', 0.2); // fav sound
            for(let i=0; i<40; i++) {
                particles.push({
                    x: x, y: y,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 10 - 5,
                    dy: Math.random() * -10 - 5,
                    color: `hsl(${Math.random()*360}, 100%, 50%)`,
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngle: 0,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05
                });
            }
        }
        function drawConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.2; // gravity
                p.y += p.dy;
                p.x += p.dx;
                
                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                if (p.y > canvas.height) particles.splice(index, 1);
            });
            requestAnimationFrame(drawConfetti);
        }
        drawConfetti();

        // --- Color Picker חכם ---
        const accentPicker = document.getElementById('accentPicker');
        const savedAccent = localStorage.getItem('accentColor') || '#4f46e5';
        accentPicker.value = savedAccent;
        document.documentElement.style.setProperty('--accent', savedAccent);
        
        accentPicker.addEventListener('input', (e) => {
            const val = e.target.value;
            document.documentElement.style.setProperty('--accent', val);
            localStorage.setItem('accentColor', val);
        });

        // --- נושא יום/לילה ---
        let currentTheme = localStorage.getItem('theme') || 'light';
        
        function updateThemeUI() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            const themeText = document.getElementById('themeToggleText');
            const themeIcon = document.getElementById('themeToggleIcon');
            if (currentTheme === 'dark') {
                themeText.textContent = 'מצב עיצוב: לילה';
                themeIcon.innerHTML = '🌙';
            } else {
                themeText.textContent = 'מצב עיצוב: יום';
                themeIcon.innerHTML = '☀️';
            }
        }
        updateThemeUI();

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', currentTheme);
            updateThemeUI();
        }

        const icons = {
            heartOutline: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
            pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
            play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
        };

        // --- חיפוש קולי ---
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const voiceBtn = document.getElementById('voiceSearchBtn');
        const searchInput = document.getElementById('searchInput');
        if(SpeechRec) {
            const rec = new SpeechRec();
            rec.lang = 'he-IL';
            rec.onstart = () => voiceBtn.classList.add('recording');
            rec.onend = () => voiceBtn.classList.remove('recording');
            rec.onresult = (e) => {
                searchInput.value = e.results[0][0].transcript;
                applyFilterAndSort();
            };
            voiceBtn.addEventListener('click', () => rec.start());
        } else {
            voiceBtn.style.display = 'none';
        }

        // --- נתונים וגלריה ---
        let rawFiles = [], filteredFiles = [], adList = [];
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let currentIndex = 0;
        const limitPerPage = 20; 
        let activeFilter = 'all';
        let activeSort = localStorage.getItem('sortPref') || 'name-asc';
        
        const galleryContainer = document.getElementById('galleryContainer');
        const sortSelect = document.getElementById('sortSelect');
        sortSelect.value = activeSort;
        const loader = document.getElementById('loader');
        const statsText = document.getElementById('statsText');

        function getRepoDetails() {
            const host = window.location.hostname, path = window.location.pathname;
            if (host.includes('github.io')) return { owner: host.split('.')[0], repo: path.split('/').filter(Boolean)[0] || '' };
            return { owner: 'YOUR_USERNAME', repo: 'YOUR_REPO' };
        }

        async function initGallery() {
            if(audioCtx.state === 'suspended') {
                document.body.addEventListener('click', () => audioCtx.resume(), {once:true});
            }

            const { owner, repo } = getRepoDetails();
            if (owner === 'YOUR_USERNAME') { statsText.textContent = 'יש להעלות ל-GitHub Pages'; return; }

            loader.style.display = 'block'; statsText.textContent = 'מחפש קבצים...';
            const cacheKey = `gallery_pro_${owner}_${repo}`, cacheTimeKey = `${cacheKey}_time`;
            const isCacheValid = sessionStorage.getItem(cacheKey) && (Date.now() - parseInt(sessionStorage.getItem(cacheTimeKey)) < 15*60*1000);

            try {
                let allFetched = [];
                if (isCacheValid) allFetched = JSON.parse(sessionStorage.getItem(cacheKey));
                else {
                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
                    if (!res.ok) throw new Error();
                    allFetched = await res.json();
                    sessionStorage.setItem(cacheKey, JSON.stringify(allFetched)); sessionStorage.setItem(cacheTimeKey, Date.now().toString());
                }

                try { const adRes = await fetch('1.json'); if (adRes.ok) adList = await adRes.json(); } catch (e) {}
                const adNames = Array.isArray(adList) ? adList.map(a => a.image.toLowerCase()) : [];

                rawFiles = allFetched.filter(f => {
                    if (f.type !== 'file') return false;
                    const name = f.name.toLowerCase(), ext = name.split('.').pop();
                    return ['jpg','jpeg','png','gif','webp','svg','bmp','avif'].includes(ext) && !adNames.includes(name) && name !== '1.png';
                });

                loader.style.display = 'none';
                buildFilters(); applyFilterAndSort();

                if (adList.length > 0) {
                    document.getElementById('mainContainer').classList.add('has-sidebar');
                    initAdSystem(allFetched);
                }

                observer.observe(document.getElementById('scrollObserver'));

            } catch (e) { loader.style.display = 'none'; statsText.textContent = 'שגיאת רשת מול GitHub.'; }
        }

        // --- פרסומות ---
        let currentAdIndex = 0;
        function initAdSystem(allFiles) {
            const sideImg = document.getElementById('sidebarAdImg'), sideLink = document.getElementById('sidebarAdLink');
            function rotateAd() {
                if(!adList.length) return;
                const ad = adList[currentAdIndex], fileObj = allFiles.find(f => f.name.toLowerCase() === ad.image.toLowerCase());
                if(fileObj) {
                    sideImg.classList.add('fading');
                    setTimeout(() => { sideImg.src = fileObj.download_url; sideLink.href = sanitizeHTML(ad.link || '#'); sideImg.onload = () => sideImg.classList.remove('fading'); }, 500);
                }
                currentAdIndex = (currentAdIndex + 1) % adList.length;
            }
            rotateAd(); setInterval(rotateAd, 10000);

            function showPopup() {
                if(!adList.length || document.querySelector('.modal-overlay.active')) return;
                const rand = adList[Math.floor(Math.random() * adList.length)], fileObj = allFiles.find(f => f.name.toLowerCase() === rand.image.toLowerCase());
                if(fileObj) {
                    document.getElementById('popupAdImg').src = fileObj.download_url;
                    document.getElementById('popupAdLink').href = sanitizeHTML(rand.link || '#');
                    document.getElementById('adModal').classList.add('active');
                }
            }
            setTimeout(showPopup, 3000); setInterval(showPopup, 300000);
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function openShortcuts() { document.getElementById('shortcutsModal').classList.add('active'); }

        // --- פילטרים ---
        function buildFilters() {
            const formats = new Set(); rawFiles.forEach(f => formats.add(f.name.split('.').pop().toLowerCase()));
            const wrap = document.getElementById('filterChips');
            formats.forEach(f => {
                const btn = document.createElement('button'); btn.className = 'filter-chip'; btn.textContent = sanitizeHTML(f.toUpperCase());
                btn.onclick = () => setFilter(f, btn); wrap.appendChild(btn);
            });
        }
        function setFilter(type, btn) {
            activeFilter = type; document.querySelectorAll('.filter-chip').forEach(c => {
                if (!c.classList.contains('fav') && !c.classList.contains('autoscroll')) c.classList.remove('active');
            });
            if(btn) btn.classList.add('active'); applyFilterAndSort();
        }

        function toggleFav(url, btn, e) {
            if(e) {
                fireConfetti(e.clientX, e.clientY);
            }
            if (favorites.includes(url)) {
                favorites = favorites.filter(fav => fav !== url);
                if(btn) { btn.classList.remove('active'); btn.innerHTML = icons.heartOutline; }
            } else {
                favorites.push(url);
                if(btn) { btn.classList.add('active'); }
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            if (activeFilter === 'favorites') applyFilterAndSort();
        }

        function debounce(func, wait) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => func(...args), wait); }; }

        function applyFilterAndSort() {
            let res = [...rawFiles];
            if (activeFilter === 'favorites') res = res.filter(f => favorites.includes(f.download_url));
            else if (activeFilter !== 'all') res = res.filter(f => f.name.split('.').pop().toLowerCase() === activeFilter);
            
            const searchVal = searchInput.value.toLowerCase().trim();
            if (searchVal !== '') res = res.filter(f => f.name.toLowerCase().includes(searchVal));

            if (activeSort === 'name-asc') res.sort((a, b) => a.name.localeCompare(b.name));
            else if (activeSort === 'name-desc') res.sort((a, b) => b.name.localeCompare(a.name));
            else if (activeSort === 'random') res.sort(() => Math.random() - 0.5);

            filteredFiles = res; renderGallery(true);
        }

        searchInput.addEventListener('input', debounce(applyFilterAndSort, 300));
        sortSelect.addEventListener('change', (e) => { activeSort = e.target.value; localStorage.setItem('sortPref', activeSort); applyFilterAndSort(); });

        // --- Render Gallery & Tilt & DoubleClick ---
        function renderGallery(reset = false) {
            if (reset) { galleryContainer.innerHTML = ''; currentIndex = 0; }
            const limit = currentIndex + limitPerPage;
            const items = filteredFiles.slice(currentIndex, limit);

            items.forEach((file, idx) => {
                const card = document.createElement('div'); card.className = 'img-card skeleton-card';
                galleryContainer.appendChild(card);

                const globalIdx = currentIndex + idx;
                
                const realCardHTML = `
                    <div class="card-img-wrap" onclick="openLightbox(${globalIdx})">
                        <button class="fav-heart-btn card-actions-top ${favorites.includes(file.download_url) ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${sanitizeHTML(file.download_url)}', this, event)" title="שמור">
                            ${icons.heartOutline}
                        </button>
                        <img src="${sanitizeHTML(file.download_url)}" alt="${sanitizeHTML(file.name)}" loading="lazy">
                    </div>
                    <div class="card-footer">
                        <div class="card-buttons">
                            <button class="action-mini-btn" onclick="copyLink('${sanitizeHTML(file.download_url)}')" title="העתק"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                            <button class="action-mini-btn" onclick="downloadFile('${sanitizeHTML(file.download_url)}', '${sanitizeHTML(file.name)}')" title="הורד"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
                        </div>
                        <span class="card-title" title="${sanitizeHTML(file.name)}">${sanitizeHTML(file.name)}</span>
                    </div>
                `;

                const tempImg = new Image();
                tempImg.src = file.download_url;
                tempImg.onload = () => {
                    card.classList.remove('skeleton-card');
                    card.innerHTML = realCardHTML;
                    attachCardEvents(card, file, globalIdx);
                };
                tempImg.onerror = () => card.style.display = 'none';
            });
            currentIndex = limit;
            statsText.textContent = `מציג ${Math.min(currentIndex, filteredFiles.length)} מתוך ${filteredFiles.length} תוצאות`;
        }

        function attachCardEvents(card, file, idx) {
            // הנטייה תלת מימדית עודנה והוקטנה פי 3 לבקשתך
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                const centerX = rect.width / 2; const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -3;
                const rotateY = ((x - centerX) / centerX) * 3;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01,1.01,1.01)`;
            });
            card.addEventListener('mouseleave', () => card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)`);
            
            const imgWrap = card.querySelector('.card-img-wrap');
            imgWrap.addEventListener('dblclick', (e) => {
                e.stopPropagation(); e.preventDefault();
                const btn = card.querySelector('.fav-heart-btn');
                toggleFav(file.download_url, btn, e);
            });

            card.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showContextMenu(e.clientX, e.clientY, file, idx);
            });
        }

        // --- Context Menu ---
        const ctxMenu = document.getElementById('contextMenu');
        function showContextMenu(x, y, file, idx) {
            ctxMenu.style.display = 'flex';
            ctxMenu.style.left = x + 'px'; ctxMenu.style.top = y + 'px';
            document.getElementById('ctxOpen').onclick = () => { openLightbox(idx); ctxMenu.style.display='none'; };
            document.getElementById('ctxCopy').onclick = () => { copyLink(file.download_url); ctxMenu.style.display='none'; };
            document.getElementById('ctxDownload').onclick = () => { downloadFile(file.download_url, file.name); ctxMenu.style.display='none'; };
        }
        document.addEventListener('click', () => ctxMenu.style.display = 'none');

        // --- Infinite Scroll ---
        const observer = new IntersectionObserver((entries) => {
            if(entries[0].isIntersecting && currentIndex < filteredFiles.length) renderGallery(false);
        }, { rootMargin: '200px' });

        // --- Layout Switcher ---
        const savedLayout = localStorage.getItem('layoutPref') || 5;
        function setLayout(cols, btn) {
            if(cols === 'list') {
                galleryContainer.className = `gallery-grid list-view`;
            } else {
                galleryContainer.className = `gallery-grid cols-${cols}`;
            }
            document.querySelectorAll('.layout-switcher button').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            localStorage.setItem('layoutPref', cols);
        }
        const layoutBtns = document.querySelectorAll('.layout-switcher button');
        layoutBtns.forEach(b => { if(b.textContent == savedLayout || (savedLayout=='list' && b.textContent=='רשימה')) setLayout(savedLayout, b); });

        // --- פעולות מיני ---
        function copyLink(url) { navigator.clipboard.writeText(url); showToast('הקישור הועתק בהצלחה!'); playTone(500, 'square', 0.1); }
        async function downloadFile(url, name) {
            try {
                showToast('מתחיל הורדה...');
                const res = await fetch(url); const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob); const a = document.createElement('a');
                a.href = blobUrl; a.download = sanitizeHTML(name); document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(blobUrl);
            } catch (e) { window.open(url, '_blank'); }
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // --- Auto Scroll הועבר לסרגל הראשי ---
        let autoScrollInterval = null;
        function toggleAutoScroll(btn) {
            if(autoScrollInterval) {
                clearInterval(autoScrollInterval); autoScrollInterval = null;
                btn.classList.remove('active');
            } else {
                autoScrollInterval = setInterval(() => window.scrollBy(0, 1), 30);
                btn.classList.add('active');
            }
        }

        // --- Lightbox Pro ---
        let lbIndex = 0, lbTimer, isPlaying = false, wakeLock = null;
        const lbModal = document.getElementById('lightboxModal'), lbImg = document.getElementById('lightboxImg');
        
        const fBright=document.getElementById('filterBright'), fCont=document.getElementById('filterCont');
        const fSat=document.getElementById('filterSat'), fGray=document.getElementById('filterGray');

        function updateFilters() {
            lbImg.style.filter = `brightness(${fBright.value}%) contrast(${fCont.value}%) saturate(${fSat.value}%) grayscale(${fGray.value}%)`;
        }
        [fBright, fCont, fSat, fGray].forEach(el => el.addEventListener('input', updateFilters));

        function resetFilters() {
            fBright.value = 100; fCont.value = 100; fSat.value = 100; fGray.value = 0; updateFilters();
        }

        function openLightbox(idx) {
            lbIndex = idx; updateLbImage(); resetFilters();
            lbModal.classList.add('active'); document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            lbModal.classList.remove('active'); document.body.style.overflow = '';
            stopSlideshow(); setTimeout(() => lbImg.src = '', 300);
            if(document.fullscreenElement) document.exitFullscreen();
        }
        function navigateLightbox(dir) {
            lbIndex += dir;
            if (lbIndex >= filteredFiles.length) lbIndex = 0;
            if (lbIndex < 0) lbIndex = filteredFiles.length - 1;
            updateLbImage(); resetFilters();
        }
        function updateLbImage() {
            if (filteredFiles[lbIndex]) {
                lbImg.src = sanitizeHTML(filteredFiles[lbIndex].download_url);
                document.getElementById('lbCounter').textContent = `${lbIndex + 1} / ${filteredFiles.length}`;
            }
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
        }
        function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }

        function toggleSlideshow() { isPlaying ? stopSlideshow() : startSlideshow(); }
        function startSlideshow() {
            isPlaying = true; document.getElementById('slideshowBtn').innerHTML = `${icons.pause} עצור`;
            lbTimer = setInterval(() => navigateLightbox(1), 3000);
            requestWakeLock();
        }
        function stopSlideshow() {
            isPlaying = false; document.getElementById('slideshowBtn').innerHTML = `${icons.play} מצגת`;
            clearInterval(lbTimer); releaseWakeLock();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) lbModal.requestFullscreen().catch(err => {});
            else document.exitFullscreen();
        }

        function favCurrentLightbox() {
            if(filteredFiles[lbIndex]) {
                toggleFav(filteredFiles[lbIndex].download_url, null);
                showToast('הוסף למועדפים!');
                fireConfetti(window.innerWidth/2, window.innerHeight/2);
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.key === '?') { e.preventDefault(); openShortcuts(); return; }
            if(e.key === '/') { e.preventDefault(); searchInput.focus(); return; }
            
            if (!lbModal.classList.contains('active')) return;
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'f' || e.key === 'F') favCurrentLightbox();
            if (e.key === 'd' || e.key === 'D') downloadFile(filteredFiles[lbIndex].download_url, filteredFiles[lbIndex].name);
        });

        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
