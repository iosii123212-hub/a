<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תמונות לכאן | גלריה אלגנטית</title>
    
    <link rel="icon" type="image/png" href="1.png">
    
    <!-- פונט רוביק - רך, נעים ומודרני -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* עיצוב בהיר (ברירת מחדל) - צבעים רכים ונעימים */
            --bg-app: #f4f6f8;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f9fafb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #e0e7ff;
            --danger: #f43f5e;
            
            /* הצללות עדינות למראה מרחף */
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.08);
            
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        [data-theme="dark"] {
            /* עיצוב כהה - כחול/אפור עמוק ואלגנטי, לא שחור גס */
            --bg-app: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-hover: #273548;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-soft: #312e81;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
            
            --glass-bg: rgba(30, 41, 59, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-container {
            display: flex;
            flex: 1;
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 40px;
            gap: 30px;
        }

        .content-area {
            flex: 1;
            min-width: 0; /* מונע גלישה החוצה */
        }

        /* סרגל צד לפרסומות */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            display: none; /* יוסתר אם אין פרסומות */
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 90px;
            height: max-content;
        }

        .has-sidebar .sidebar {
            display: flex;
        }

        @media (max-width: 1024px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; position: relative; top: 0; max-width: 400px; margin: 0 auto; }
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1800px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand img {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .icon-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .layout-switcher {
            display: flex;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 4px;
            box-shadow: var(--shadow-sm);
        }

        .layout-switcher button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius-full);
            transition: all 0.2s;
        }

        .layout-switcher button.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
        }

        @media (max-width: 600px) {
            .layout-switcher { display: none; }
        }

        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px 0;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
            min-width: 250px;
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px; /* ריווח ימני לאייקון ב-RTL */
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .sort-select {
            padding: 0 20px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            height: 44px;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-chip {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-chip:hover {
            border-color: var(--text-muted);
        }

        .filter-chip.active {
            background: var(--text-main);
            color: var(--bg-surface);
            border-color: var(--text-main);
        }

        .filter-chip.fav {
            color: var(--danger);
            border-color: rgba(244, 63, 94, 0.3);
        }
        
        .filter-chip.fav svg { width: 14px; height: 14px; fill: currentColor; }

        .filter-chip.fav.active {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .stats-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gallery-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        @media (min-width: 500px) { .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 768px) { .gallery-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (min-width: 1200px) { .gallery-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

        /* כפיית עמודות מהכפתורים */
        @media (min-width: 768px) {
            .gallery-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
            .gallery-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
            .gallery-grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
            .gallery-grid.cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; }
        }

        .img-card {
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .img-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-soft);
        }

        .card-img-wrap {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: zoom-in;
            position: relative;
            background: var(--bg-app);
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .img-card:hover .card-img-wrap img {
            transform: scale(1.05);
        }

        .card-actions-top {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        .fav-heart-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
        }

        .fav-heart-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .fav-heart-btn.active {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }
        
        .fav-heart-btn.active svg { fill: currentColor; }

        .card-footer {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            direction: ltr;
            text-align: right;
            flex-grow: 1;
        }

        .card-buttons {
            display: flex;
            gap: 6px;
        }

        .action-mini-btn {
            background: var(--bg-app);
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-mini-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .action-mini-btn:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: -10px;
        }

        .sidebar-ad-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: block;
            text-decoration: none;
            transition: box-shadow 0.3s;
        }

        .sidebar-ad-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent-soft);
        }

        .sidebar-ad-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.5s ease;
        }

        .sidebar-ad-card img.fading {
            opacity: 0.2;
        }

        /* פופאפ זכוכית */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            z-index: 2000;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--bg-surface);
            padding: 6px;
            border-radius: var(--radius-lg);
            max-width: 90vw;
            max-height: 85vh;
            position: relative;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--border-color);
        }

        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-close {
            position: absolute;
            top: -14px; right: -14px;
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            width: 34px; height: 34px;
            border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            z-index: 10;
            transition: all 0.2s;
        }
        
        .modal-close:hover { background: var(--danger); color: white; border-color: var(--danger); }
        .modal-close svg { width: 16px; height: 16px; fill: currentColor; }

        .ad-popup-img {
            max-width: 100%;
            max-height: calc(85vh - 12px);
            border-radius: calc(var(--radius-lg) - 6px);
            display: block;
            object-fit: contain;
        }

        /* לייטבוקס */
        .lb-img {
            max-width: 100%;
            max-height: calc(85vh - 12px);
            border-radius: calc(var(--radius-lg) - 6px);
            display: block;
        }

        .lb-controls {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        .lb-btn {
            background: var(--glass-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            width: 44px; height: 44px;
            border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.2s;
        }

        .lb-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .lb-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .lb-btn.play { width: auto; padding: 0 20px; font-weight: 500; font-size: 0.9rem; gap: 8px;}

        /* כפתור טען עוד וספינר */
        .load-more-wrap { display: flex; justify-content: center; margin: 30px 0; }
        
        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
        }
        
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* הודעת Toast */
        .toast {
            position: fixed; bottom: 30px; left: 30px;
            background: var(--text-main); color: var(--bg-surface);
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-size: 0.9rem; font-weight: 500;
            box-shadow: var(--shadow-lg);
            transform: translateY(100px) scale(0.9);
            opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3000;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateY(0) scale(1); opacity: 1; }
        .toast svg { width: 18px; height: 18px; fill: var(--bg-surface); }
    </style>
</head>
<body id="appBody">

    <header>
        <div class="header-inner">
            <a href="#" class="brand">
                <img src="1.png" alt="לוגו" onerror="this.style.display='none'">
                <h1>תמונות לכאן</h1>
            </a>
            
            <div class="header-controls">
                <div class="layout-switcher">
                    <button onclick="setLayout(3, this)">3</button>
                    <button onclick="setLayout(4, this)">4</button>
                    <button class="active" onclick="setLayout(5, this)">5</button>
                    <button onclick="setLayout(6, this)">6</button>
                </div>
                
                <button class="icon-btn" id="themeToggle" title="החלף עיצוב יום/לילה">
                    <!-- שמש / ירח אייקון יוזרק כאן דרך JS -->
                </button>
            </div>
        </div>
    </header>

    <div class="main-container" id="mainContainer">
        
        <!-- תוכן מרכזי -->
        <main class="content-area">
            <div class="toolbar">
                <div class="search-bar">
                    <div class="search-input-wrapper">
                        <!-- אייקון זכוכית מגדלת -->
                        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="searchInput" class="search-input" placeholder="חיפוש חכם...">
                    </div>
                    <select id="sortSelect" class="sort-select">
                        <option value="name-asc">מיון: א' עד ת'</option>
                        <option value="name-desc">מיון: ת' עד א'</option>
                        <option value="random">אקראי 🎲</option>
                    </select>
                </div>
                
                <div class="filters" id="filterChips">
                    <button class="filter-chip active" onclick="setFilter('all', this)">הכל</button>
                    <button class="filter-chip fav" onclick="setFilter('favorites', this)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        מועדפים
                    </button>
                </div>

                <div class="stats-text">
                    <div id="loader" class="spinner" style="display: none;"></div>
                    <span id="statsText">מתחבר למאגר הנתונים...</span>
                </div>
            </div>

            <div class="gallery-grid cols-5" id="galleryContainer"></div>
            
            <div class="load-more-wrap" id="loadMoreSection" style="display: none;">
                <button class="btn-primary" id="loadMoreBtn">טען עוד תמונות</button>
            </div>
        </main>

        <aside class="sidebar">
            <span class="sidebar-title">חסות</span>
            <a href="#" class="sidebar-ad-card" id="sidebarAdLink" target="_blank">
                <img src="" alt="פרסומת ממומנת" id="sidebarAdImg">
            </a>
        </aside>

    </div>

    
    <!-- פופאפ פרסומת מרכזי -->
    <div class="modal-overlay" id="adModal" onclick="closeAdModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeAdModal()">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <a href="#" id="popupAdLink" target="_blank">
                <img src="" alt="מבצע מיוחד" id="popupAdImg" class="ad-popup-img">
            </a>
        </div>
    </div>

    <!-- לייטבוקס (מצגת תמונות) -->
    <div class="modal-overlay" id="lightboxModal" onclick="closeLightbox()">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none;" onclick="event.stopPropagation()">
            <button class="modal-close" style="top: -20px; right: -20px;" onclick="closeLightbox()">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <img id="lightboxImg" src="" alt="" class="lb-img">
            
            <div class="lb-controls">
                <button class="lb-btn" onclick="navigateLightbox(-1)" title="הבא (ימינה)">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
                <button class="lb-btn play" id="slideshowBtn" onclick="toggleSlideshow()">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> מצגת
                </button>
                <button class="lb-btn" onclick="navigateLightbox(1)" title="הקודם (שמאלה)">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- הודעת קופצת מסוג טוסט -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
        הקישור הועתק בהצלחה
    </div>

    <script>
        // --- מערכת אייקונים ---
        const icons = {
            sun: '<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>',
            moon: '<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3m0-2c.34 0 .67.03 1 .08C10.59 2.01 8.5 4.14 8.5 6.8c0 2.66 2.09 4.79 4.5 5.72-.03.33-.08.66-.08 1 0 3.86 3.14 7 7 7 .34 0 .67-.05 1-.08C18.99 22.42 15.7 24 12 24 5.37 24 0 18.63 0 12S5.37 0 12 0z"/></svg>',
            heartOutline: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
            download: '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>',
            link: '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>',
            play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
            pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
        };

        // --- מצב יום / לילה ---
        const themeToggle = document.getElementById('themeToggle');
        let currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.innerHTML = currentTheme === 'dark' ? icons.sun : icons.moon;

        themeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            themeToggle.innerHTML = currentTheme === 'dark' ? icons.sun : icons.moon;
            localStorage.setItem('theme', currentTheme);
        });

        // --- פריסה (עמודות) ---
        function setLayout(cols, btn) {
            document.getElementById('galleryContainer').className = `gallery-grid cols-${cols}`;
            document.querySelectorAll('.layout-switcher button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- משתנים ומערכים ---
        const imageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'avif'];
        let rawFiles = [];
        let filteredFiles = [];
        let adList = [];
        
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let currentIndex = 0;
        const limitPerPage = 60;
        let activeFilter = 'all';
        let activeSort = 'name-asc';

        // אלמנטים
        const galleryContainer = document.getElementById('galleryContainer');
        const statsText = document.getElementById('statsText');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        function getRepoDetails() {
            const hostname = window.location.hostname;
            const pathname = window.location.pathname;
            if (hostname.includes('github.io')) {
                const owner = hostname.split('.')[0];
                const repo = pathname.split('/').filter(Boolean)[0] || '';
                return { owner, repo };
            }
            return { owner: 'YOUR_USERNAME', repo: 'YOUR_REPO' };
        }

        async function initGallery() {
            const { owner, repo } = getRepoDetails();
            if (owner === 'YOUR_USERNAME') {
                statsText.textContent = 'יש להעלות ל-GitHub Pages להצגת תמונות';
                return;
            }

            loader.style.display = 'block';
            statsText.textContent = 'מחפש קבצים...';

            try {
                // מנגנון מטמון למניעת חסימות גיטהאב
                const cacheKey = `gallery_elegant_${owner}_${repo}`;
                const cacheTimeKey = `${cacheKey}_time`;
                const isCacheValid = sessionStorage.getItem(cacheKey) && (Date.now() - parseInt(sessionStorage.getItem(cacheTimeKey)) < 15 * 60 * 1000);

                let allFetchedFiles = [];
                if (isCacheValid) {
                    allFetchedFiles = JSON.parse(sessionStorage.getItem(cacheKey));
                } else {
                    const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
                    if (!response.ok) throw new Error();
                    allFetchedFiles = await response.json();
                    sessionStorage.setItem(cacheKey, JSON.stringify(allFetchedFiles));
                    sessionStorage.setItem(cacheTimeKey, Date.now().toString());
                }

                // טעינת פרסומות מ- 1.json
                try {
                    const adRes = await fetch('1.json');
                    if (adRes.ok) adList = await adRes.json();
                } catch (e) { /* מתעלמים אם אין קובץ */ }

                const adNames = Array.isArray(adList) ? adList.map(a => a.image.toLowerCase()) : [];

                // סינון תמונות בלבד (ללא פרסומות לגלריה וללא לוגו האתר)
                rawFiles = allFetchedFiles.filter(f => {
                    if (f.type !== 'file') return false;
                    const fileNameLower = f.name.toLowerCase();
                    const ext = fileNameLower.split('.').pop();
                    
                    return imageExtensions.includes(ext) && 
                           !adNames.includes(fileNameLower) && 
                           fileNameLower !== '1.png'; // הסתרת הלוגו מהגלריה
                });

                loader.style.display = 'none';
                buildFilters();
                applyFilterAndSort();

                // הפעלת פרסומות
                if (adList.length > 0) {
                    document.getElementById('mainContainer').classList.add('has-sidebar');
                    initAdSystem(allFetchedFiles);
                }

            } catch (e) {
                loader.style.display = 'none';
                statsText.textContent = 'שגיאה. ייתכן שחרגת ממגבלת הבקשות של GitHub.';
            }
        }

        let currentAdIndex = 0;
        
        function initAdSystem(allFiles) {
            const sidebarImg = document.getElementById('sidebarAdImg');
            const sidebarLink = document.getElementById('sidebarAdLink');
            
            // פונקציית עדכון פרסומת בסרגל צד
            function rotateAd() {
                if(!adList.length) return;
                const ad = adList[currentAdIndex];
                const fileObj = allFiles.find(f => f.name.toLowerCase() === ad.image.toLowerCase());
                
                if(fileObj) {
                    sidebarImg.classList.add('fading');
                    setTimeout(() => {
                        sidebarImg.src = fileObj.download_url;
                        sidebarLink.href = ad.link || '#';
                        sidebarImg.onload = () => sidebarImg.classList.remove('fading');
                    }, 500);
                }
                currentAdIndex = (currentAdIndex + 1) % adList.length;
            }

            rotateAd(); // קריאה ראשונה
            setInterval(rotateAd, 10000); // כל 10 שניות

            // פופאפ פעם ב-5 דקות
            function showPopup() {
                if(!adList.length) return;
                const randomAd = adList[Math.floor(Math.random() * adList.length)];
                const fileObj = allFiles.find(f => f.name.toLowerCase() === randomAd.image.toLowerCase());
                
                if(fileObj) {
                    document.getElementById('popupAdImg').src = fileObj.download_url;
                    document.getElementById('popupAdLink').href = randomAd.link || '#';
                    document.getElementById('adModal').classList.add('active');
                }
            }
            
            setTimeout(showPopup, 3000); // קפיצה ראשונית מהירה
            setInterval(showPopup, 300000); // 5 דקות
        }

        function closeAdModal() {
            document.getElementById('adModal').classList.remove('active');
        }

        function buildFilters() {
            const formats = new Set();
            rawFiles.forEach(f => formats.add(f.name.split('.').pop().toLowerCase()));
            
            const filterContainer = document.getElementById('filterChips');
            formats.forEach(format => {
                const btn = document.createElement('button');
                btn.className = 'filter-chip';
                btn.textContent = format.toUpperCase();
                btn.onclick = () => setFilter(format, btn);
                filterContainer.appendChild(btn);
            });
        }

        function setFilter(type, btn) {
            activeFilter = type;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            if(btn) btn.classList.add('active');
            applyFilterAndSort();
        }

        function toggleFav(url, btn) {
            if (favorites.includes(url)) {
                favorites = favorites.filter(fav => fav !== url);
                btn.classList.remove('active');
                btn.innerHTML = icons.heartOutline;
            } else {
                favorites.push(url);
                btn.classList.add('active');
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            if (activeFilter === 'favorites') applyFilterAndSort();
        }

        function debounce(func, wait) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        }

        function applyFilterAndSort() {
            let result = [...rawFiles];

            if (activeFilter === 'favorites') {
                result = result.filter(f => favorites.includes(f.download_url));
            } else if (activeFilter !== 'all') {
                result = result.filter(f => f.name.split('.').pop().toLowerCase() === activeFilter);
            }

            const searchVal = searchInput.value.toLowerCase().trim();
            if (searchVal !== '') {
                result = result.filter(f => f.name.toLowerCase().includes(searchVal));
            }

            if (activeSort === 'name-asc') result.sort((a, b) => a.name.localeCompare(b.name));
            else if (activeSort === 'name-desc') result.sort((a, b) => b.name.localeCompare(a.name));
            else if (activeSort === 'random') result.sort(() => Math.random() - 0.5);

            filteredFiles = result;
            renderGallery(true);
        }

        function renderGallery(reset = false) {
            if (reset) {
                galleryContainer.innerHTML = '';
                currentIndex = 0;
            }

            const limit = currentIndex + limitPerPage;
            const items = filteredFiles.slice(currentIndex, limit);

            items.forEach((file, idx) => {
                const globalIdx = currentIndex + idx;
                galleryContainer.appendChild(createCard(file, globalIdx));
            });

            currentIndex = limit;
            statsText.textContent = `מציג ${Math.min(currentIndex, filteredFiles.length)} מתוך ${filteredFiles.length} תוצאות`;
            document.getElementById('loadMoreSection').style.display = currentIndex < filteredFiles.length ? 'flex' : 'none';
        }

        function createCard(file, idx) {
            const card = document.createElement('div');
            card.className = 'img-card';

            const isFav = favorites.includes(file.download_url);
            
            // תמונה וכפתור לב מעליה
            const topDiv = document.createElement('div');
            topDiv.className = 'card-img-wrap';
            topDiv.onclick = () => openLightbox(idx);
            
            const favBtn = document.createElement('button');
            favBtn.className = `fav-heart-btn card-actions-top ${isFav ? 'active' : ''}`;
            favBtn.innerHTML = icons.heartOutline;
            favBtn.title = 'שמור למועדפים';
            favBtn.onclick = (e) => { e.stopPropagation(); toggleFav(file.download_url, favBtn); };
            
            const img = document.createElement('img');
            img.src = file.download_url;
            img.loading = 'lazy';
            img.onerror = () => card.style.display = 'none';
            
            topDiv.appendChild(favBtn);
            topDiv.appendChild(img);
            
            // תחתית (שם + פעולות)
            const footerDiv = document.createElement('div');
            footerDiv.className = 'card-footer';
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'card-title';
            titleSpan.textContent = file.name;
            titleSpan.title = file.name;

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'card-buttons';
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-mini-btn';
            copyBtn.innerHTML = icons.link;
            copyBtn.title = 'העתק קישור';
            copyBtn.onclick = (e) => {
                e.stopPropagation();
                navigator.clipboard.writeText(file.download_url);
                showToast();
            };

            const dlBtn = document.createElement('button');
            dlBtn.className = 'action-mini-btn';
            dlBtn.innerHTML = icons.download;
            dlBtn.title = 'הורדה';
            dlBtn.onclick = () => downloadFile(file.download_url, file.name);

            actionsDiv.appendChild(copyBtn);
            actionsDiv.appendChild(dlBtn);

            footerDiv.appendChild(actionsDiv);
            footerDiv.appendChild(titleSpan);

            card.appendChild(topDiv);
            card.appendChild(footerDiv);

            return card;
        }

        async function downloadFile(url, name) {
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (e) { window.open(url, '_blank'); }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // מאזינים
        searchInput.addEventListener('input', debounce(applyFilterAndSort, 300));
        sortSelect.addEventListener('change', (e) => { activeSort = e.target.value; applyFilterAndSort(); });
        document.getElementById('loadMoreBtn').addEventListener('click', () => renderGallery(false));

        let lbIndex = 0;
        let lbTimer;
        let isPlaying = false;
        const lbModal = document.getElementById('lightboxModal');
        const lbImg = document.getElementById('lightboxImg');
        const slideBtn = document.getElementById('slideshowBtn');

        function openLightbox(idx) {
            lbIndex = idx;
            updateLbImage();
            lbModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lbModal.classList.remove('active');
            document.body.style.overflow = '';
            stopSlideshow();
            setTimeout(() => lbImg.src = '', 300);
        }

        function navigateLightbox(dir) {
            lbIndex += dir;
            if (lbIndex >= filteredFiles.length) lbIndex = 0;
            if (lbIndex < 0) lbIndex = filteredFiles.length - 1;
            updateLbImage();
        }

        function updateLbImage() {
            if (filteredFiles[lbIndex]) {
                lbImg.src = filteredFiles[lbIndex].download_url;
            }
        }

        function toggleSlideshow() {
            isPlaying ? stopSlideshow() : startSlideshow();
        }

        function startSlideshow() {
            isPlaying = true;
            slideBtn.innerHTML = `${icons.pause} עצור`;
            lbTimer = setInterval(() => navigateLightbox(1), 3000);
        }

        function stopSlideshow() {
            isPlaying = false;
            slideBtn.innerHTML = `${icons.play} מצגת`;
            clearInterval(lbTimer);
        }

        document.addEventListener('keydown', (e) => {
            if (!lbModal.classList.contains('active')) return;
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
            if (e.key === 'Escape') closeLightbox();
        });

        // התחלה
        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
